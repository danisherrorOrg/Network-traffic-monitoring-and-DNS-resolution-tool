[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netscope"
version = "0.1.0"
description = "Real-time network traffic monitor with intelligent IP enrichment"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["network", "monitor", "traffic", "packet-capture", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "scapy>=2.5",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

# After `pip install -e .`, users can run `netscope` directly from the terminal
[project.scripts]
netscope = "netscope.__main__:main"

[project.urls]
Homepage   = "https://github.com/yourusername/netscope"
Repository = "https://github.com/yourusername/netscope"
Issues     = "https://github.com/yourusername/netscope/issues"

# ── Hatch build config ────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["netscope"]

# ── Ruff linter config ────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # line length handled by formatter

# ── Mypy type checker ─────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true  # scapy has no stubs

# ── Pytest config ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths     = ["tests"]
addopts       = "-v --tb=short"